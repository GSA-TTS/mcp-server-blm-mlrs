applications:
  - name: geothermal-leases-mcp-server
    buildpacks:
      - python_buildpack
    command: PYTHONPATH=src python -m geothermal_leases.app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: geothermal-leases-mcp-server.app.cloud.gov
    disk_quota: 1G
    memory: 125M